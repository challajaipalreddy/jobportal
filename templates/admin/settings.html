{% extends "admin/base.html" %}

{% block title %}Website Settings - Admin Panel{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
    <div>
        <h3 class="fw-bold mb-1"><i class="bi bi-gear me-2"></i> Website Settings</h3>
        <p class="text-muted small mb-0">Configure global website announcement banners and parameters.</p>
    </div>
</div>

<div class="card border-0 shadow-sm rounded-4 p-4 max-w-600">
    <form action="{{ url_for('admin.settings') }}" method="POST">
        <div class="mb-4">
            <label class="form-label fw-semibold">Top Announcement Banner</label>
            <input type="text" name="announcement_banner" value="{{ announcement }}" class="form-control" placeholder="e.g. 🔥 2026 Off-Campus Placement Drives Active Now!">
        </div>
        <button type="submit" class="btn btn-accent rounded-pill px-4">Save Settings</button>
    </form>
</div>
{% endblock %}
